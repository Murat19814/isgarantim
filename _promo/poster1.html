<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
  body{width:1080px;height:1080px;overflow:hidden}
  .p{width:1080px;height:1080px;background:linear-gradient(135deg,#0a1730 0%,#12203f 55%,#0f2a4a 100%);color:#fff;padding:80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .glow{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(5,150,105,.35),transparent 70%);top:-160px;right:-160px}
  .glow2{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(224,180,74,.22),transparent 70%);bottom:-160px;left:-160px}
  .top{display:flex;align-items:center;gap:22px;z-index:2}
  .badge{width:96px;height:96px;border-radius:26px;background:#12203f;border:2px solid rgba(224,180,74,.5);display:flex;align-items:center;justify-content:center}
  .brand{font-size:56px;font-weight:800;letter-spacing:-1px}
  .brand span{color:#10b981}
  .mid{z-index:2}
  .slogan{font-size:82px;font-weight:800;line-height:1.05;letter-spacing:-2px}
  .slogan .g{color:#E0B44A}
  .sub{margin-top:26px;font-size:34px;color:#c7d2e5;font-weight:500;max-width:820px;line-height:1.4}
  .chips{margin-top:44px;display:flex;flex-wrap:wrap;gap:16px}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:16px 26px;border-radius:999px;font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px}
  .dot{width:14px;height:14px;border-radius:50%;background:#10b981}
  .bottom{z-index:2;display:flex;align-items:flex-end;justify-content:space-between}
  .site{font-size:46px;font-weight:800;color:#fff}
  .contact{text-align:right;font-size:30px;line-height:1.5;color:#e6edf7;font-weight:600}
  .wa{color:#25D366}
</style></head>
<body>
  <div class="p">
    <div class="glow"></div><div class="glow2"></div>
    <div class="top">
      <div class="badge">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#E0B44A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand">İş<span>Kalkan</span></div>
    </div>
    <div class="mid">
      <div class="slogan">İşin de ödemen de<br><span class="g">güvende.</span></div>
      <div class="sub">Doğrulanmış ustalardan güvenle hizmet al, iş ara ya da iş ilanı yayınla.</div>
      <div class="chips">
        <div class="chip"><span class="dot"></span>Doğrulanmış ustalar</div>
        <div class="chip"><span class="dot"></span>Aynı gün hizmet</div>
        <div class="chip"><span class="dot"></span>Güvenli iletişim</div>
      </div>
    </div>
    <div class="bottom">
      <div class="site">isgarantim.com</div>
      <div class="contact">📞 0553 118 37 11<br><span class="wa">✆ WhatsApp: 0535 663 41 66</span></div>
    </div>
  </div>
</body></html>
