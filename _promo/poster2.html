<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
  body{width:1080px;height:1080px;overflow:hidden}
  .p{width:1080px;height:1080px;background:#f6f8fc;color:#0a1730;padding:80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .band{position:absolute;top:0;left:0;right:0;height:300px;background:linear-gradient(135deg,#0a1730,#12203f)}
  .top{position:relative;z-index:2;display:flex;align-items:center;gap:20px;color:#fff}
  .badge{width:84px;height:84px;border-radius:22px;background:rgba(255,255,255,.08);border:2px solid rgba(224,180,74,.5);display:flex;align-items:center;justify-content:center}
  .brand{font-size:48px;font-weight:800}
  .brand span{color:#10b981}
  .card{position:relative;z-index:2;margin-top:70px;background:#fff;border-radius:36px;box-shadow:0 30px 60px rgba(10,23,48,.15);padding:60px}
  .kicker{color:#059669;font-weight:800;font-size:30px;letter-spacing:.5px}
  .h{font-size:76px;font-weight:800;line-height:1.06;letter-spacing:-2px;margin-top:14px}
  .h .g{color:#E0B44A}
  .list{margin-top:40px;display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}
  .it{display:flex;align-items:center;gap:16px;font-size:32px;font-weight:700;color:#12203f}
  .ic{width:46px;height:46px;border-radius:14px;background:#ecfdf5;color:#059669;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
  .cta{margin-top:46px;display:inline-flex;background:#059669;color:#fff;font-size:34px;font-weight:800;padding:24px 44px;border-radius:18px}
  .bottom{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between}
  .site{font-size:44px;font-weight:800;color:#0a1730}
  .contact{text-align:right;font-size:30px;line-height:1.5;font-weight:700;color:#0a1730}
  .wa{color:#059669}
</style></head>
<body>
  <div class="p">
    <div class="band"></div>
    <div class="top">
      <div class="badge"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E0B44A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="brand">İş<span>Kalkan</span></div>
    </div>
    <div class="card">
      <div class="kicker">HİZMET Mİ LAZIM?</div>
      <div class="h">Ustaya mı<br>ihtiyacın var? <span class="g">Hemen bul.</span></div>
      <div class="list">
        <div class="it"><span class="ic">✓</span>Çilingir & Tesisat</div>
        <div class="it"><span class="ic">✓</span>Elektrik & Kombi</div>
        <div class="it"><span class="ic">✓</span>Boya & Tadilat</div>
        <div class="it"><span class="ic">✓</span>Temizlik & Nakliyat</div>
      </div>
      <div class="cta">Ücretsiz talep oluştur → teklifleri karşılaştır</div>
    </div>
    <div class="bottom">
      <div class="site">isgarantim.com</div>
      <div class="contact">📞 0553 118 37 11<br><span class="wa">✆ WhatsApp: 0535 663 41 66</span></div>
    </div>
  </div>
</body></html>
