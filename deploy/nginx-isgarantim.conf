# İşKalkan — isgarantim.com Nginx server bloğu
# Bu dosya SADECE isgarantim.com'a hizmet verir; mevcut blc-tool bloğuna dokunmaz.
# Kurulum (sunucuda):
#   cp /var/www/isgarantim/deploy/nginx-isgarantim.conf /etc/nginx/sites-available/isgarantim
#   ln -s /etc/nginx/sites-available/isgarantim /etc/nginx/sites-enabled/isgarantim
#   nginx -t && systemctl reload nginx
# Ardından SSL için: certbot --nginx -d isgarantim.com -d www.isgarantim.com
# (certbot 443 bloğunu otomatik ekler.)

server {
    listen 80;
    listen [::]:80;
    server_name isgarantim.com www.isgarantim.com;

    # Fotoğraf/dosya yüklemeleri için
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
