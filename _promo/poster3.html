<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
  body{width:1080px;height:1080px;overflow:hidden}
  .p{width:1080px;height:1080px;background:linear-gradient(160deg,#04160f 0%,#0a2a1e 55%,#0a1730 100%);color:#fff;padding:80px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .glow{position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.35),transparent 70%);top:-180px;left:-140px}
  .top{display:flex;align-items:center;gap:22px;z-index:2}
  .badge{width:92px;height:92px;border-radius:24px;background:rgba(255,255,255,.06);border:2px solid rgba(224,180,74,.5);display:flex;align-items:center;justify-content:center}
  .brand{font-size:52px;font-weight:800}
  .brand span{color:#10b981}
  .mid{z-index:2}
  .free{display:inline-flex;align-items:center;gap:14px;background:#E0B44A;color:#0a1730;font-size:32px;font-weight:800;padding:16px 30px;border-radius:999px}
  .h{margin-top:30px;font-size:86px;font-weight:800;line-height:1.04;letter-spacing:-2px}
  .h .g{color:#10b981}
  .sub{margin-top:26px;font-size:34px;color:#cfe8dd;font-weight:500;max-width:840px;line-height:1.4}
  .chips{margin-top:40px;display:flex;flex-wrap:wrap;gap:16px}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:16px 26px;border-radius:999px;font-size:28px;font-weight:700;display:flex;align-items:center;gap:12px}
  .dot{width:14px;height:14px;border-radius:50%;background:#E0B44A}
  .bottom{z-index:2;display:flex;align-items:flex-end;justify-content:space-between}
  .site{font-size:46px;font-weight:800}
  .contact{text-align:right;font-size:30px;line-height:1.5;font-weight:600;color:#e6f5ee}
  .wa{color:#25D366}
</style></head>
<body>
  <div class="p">
    <div class="glow"></div>
    <div class="top">
      <div class="badge"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#E0B44A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="brand">İş<span>Kalkan</span></div>
    </div>
    <div class="mid">
      <div class="free">★ 1. YIL TAMAMEN ÜCRETSİZ</div>
      <div class="h">Usta mısın?<br><span class="g">İşini büyüt.</span></div>
      <div class="sub">Yeni müşterilere ulaş, açık taleplere teklif ver. Teklif vermek bedava; komisyon yok.</div>
      <div class="chips">
        <div class="chip"><span class="dot"></span>Ücretsiz teklif</div>
        <div class="chip"><span class="dot"></span>Güven puanı & rozetler</div>
        <div class="chip"><span class="dot"></span>Bölgende iş fırsatı</div>
      </div>
    </div>
    <div class="bottom">
      <div class="site">isgarantim.com</div>
      <div class="contact">📞 0553 118 37 11<br><span class="wa">✆ WhatsApp: 0535 663 41 66</span></div>
    </div>
  </div>
</body></html>
